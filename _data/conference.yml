# About
about: "MSML2027 is the sixth edition of a recently established international conference, emphasizing the study of mathematical theory and algorithms of machine learning, together with applications in scientific computing and engineering disciplines."

themes: 'New themes of the conference will include <strong>agentic scientific computing, with an emphasis on the mathematical and information-theoretic foundations of agent-based AI systems embedded in scientific and engineering workflows; the analysis of in-context learning, foundation models, automated reasoning, and optimization</strong>; and other themes such as neural operators, transformers, state-space models, causal inference, optimal transport, graph neural networks, and the broader mathematics of machine learning.'
