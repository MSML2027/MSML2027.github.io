# About
about: "MSML2027 is the sixth edition of a recently established international conference, emphasizing the study of mathematical theory and algorithms of machine learning, together with applications in scientific computing and engineering disciplines."

themes: 'New themes of the conference will include <strong>LLMs and agentic AI frameworks, LLM architecture analysis and applications, uncertainty quantification for machine learning, high precision PINNs, and quantum scientific machine learning.</strong> Other themes such as neural operators, digital twins, and the broader mathematics as well as applications of machine learning will also be featured.'
