<nav class="navbar">
    <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="logo">{{ site.data.conference.short_name }}</a>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="{{ '/' | relative_url }}">Home</a></li>
            <li><a href="{{ '/speakers' | relative_url }}">Keynote Speakers</a></li>
            <li><a href="{{ '/important-dates' | relative_url }}">Important Dates</a></li>
            <li><a href="{{ '/registration' | relative_url }}">Registration</a></li>
            <li><a href="{{ '/submission' | relative_url }}">Submission</a></li>
            <li><a href="{{ '/venue' | relative_url }}">Venue &amp; Accommodation</a></li>
        </ul>
    </div>
</nav>

<script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', function () {
        navLinks.classList.toggle('active');
        hamburger.classList.toggle('active');
    });

    document.addEventListener('click', function (event) {
        const isClickInsideNav = navLinks.contains(event.target) || hamburger.contains(event.target);
        if (!isClickInsideNav && navLinks.classList.contains('active')) {
            navLinks.classList.remove('active');
            hamburger.classList.remove('active');
        }
    });

    navLinks.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function () {
            if (window.innerWidth <= 768) {
                navLinks.classList.remove('active');
                hamburger.classList.remove('active');
            }
        });
    });
</script>
