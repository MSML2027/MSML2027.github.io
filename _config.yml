# Site settings
title: MSML 2027
description: 6th MSML International Conference - Mathematical theory and algorithms of machine learning
url: "https://yiweimeng.github.io"
baseurl: "/MSML2027"

# Build settings
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOY.md

# Collections
collections:
  pages:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
